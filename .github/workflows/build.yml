name: Build Cross-Platform Binaries
on: workflow_dispatch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --name "Requests Tracker" "Requests Tracker.py"

    - name: Compile with PyInstaller (Unix/Mac/Linux)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --name "Requests Tracker" "Requests Tracker.py"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RequestsTracker-${{ matrix.os }}
        path: |
          dist/Requests Tracker
          dist/Requests Tracker.exe
