<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHR | Different Strokes Tool</title>
    <style>
        :root { --rhr-red: #e31e24; --rhr-pink-fill: #fde2e2; --rhr-pink-line: #f1a9a9; --rhr-dark: #2c3e50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 500px; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-top: 6px solid var(--rhr-red); }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .rhr-logo-svg { width: 120px; height: auto; display: block; margin: 0 auto; }
        .station-name { color: var(--rhr-red); font-size: 1.2rem; font-weight: 900; text-transform: uppercase; text-align: center; margin: 15px 0;}
        .instruction { font-size: 0.85rem; color: #666; margin-bottom: 15px; text-align: center; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 0.85rem; color: #444; }
        input { width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn { width: 100%; border: none; padding: 16px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; background: var(--rhr-red); color: #fff; margin-top: 20px; }
        #output { margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 4px solid var(--rhr-red); font-size: 0.85rem; display: none; white-space: pre-wrap; cursor: pointer; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="logo-container">
            <svg class="rhr-logo-svg" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
                <path d="M80 120C80 120 20 85 20 45C20 25 35 15 50 15C60 15 72 22 80 35C88 22 100 15 110 15C125 15 140 25 140 45C140 85 80 120 80 120Z" fill="var(--rhr-pink-fill)" />
                <text x="50%" y="65%" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="48" fill="var(--rhr-red)" font-weight="900">RHR</text>
            </svg>
        </div>
        <div class="station-name">Different Strokes Tool</div>
        
        <div class="instruction">Enter an instrument <b>or</b> a reference track to generate your prompt.</div>

        <label>Instrument to Focus On</label>
        <input type="text" id="instrument" placeholder="e.g. Piano">
        
        <label>Reference Track or Artist (Optional)</label>
        <input type="text" id="reference" placeholder="e.g. Elton John">

        <button class="btn" onclick="processPrompt()">GENERATE PROMPT</button>

        <div id="output" onclick="copyToClipboard()"></div>
    </div>
</div>

<script>
    const PROMPT_URL = "https://raw.githubusercontent.com/tonywilding33/Radio/main/different_strokes_ai_prompt.txt";
    let rawTemplate = "";

    // Fetch the template in the background on load
    async function init() {
        const response = await fetch(PROMPT_URL + "?cb=" + Date.now());
        rawTemplate = await response.text();
    }

    // Process the prompt in the background once details are entered
    function processPrompt() {
        const inst = document.getElementById('instrument').value;
        const ref = document.getElementById('reference').value;
        
        if (!inst && !ref) { alert("Please enter at least one detail."); return; }

        let finalPrompt = rawTemplate
            .replace("[INSERT INSTRUMENT NAME]", inst || "the chosen instrument")
            .replace("[INSERT ARTIST/SONG NAME]", ref || "the provided reference style");

        const out = document.getElementById('output');
        out.innerText = finalPrompt;
        out.style.display = 'block';
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(document.getElementById('output').innerText);
        alert("Prompt copied to clipboard!");
    }

    init();
</script>

</body>
</html>
